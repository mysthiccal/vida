<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presente</title>
<meta name="description" content="Un acompañante diario para estar presente, curioso y cerca de los tuyos.">
<meta name="theme-color" content="#f6efdc">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presente">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --fd:'Young Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fb:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ink:#33341c; --ink2:rgba(51,52,28,.7); --ink3:rgba(51,52,28,.45);
  --glass:rgba(255,252,240,.44); --glass2:rgba(255,252,240,.7); --stroke:rgba(255,255,255,.72);
  --shadow:rgba(84,80,40,.16); --sheet:rgba(251,248,238,.86);
  --accent:#66792c; --on-accent:#ffffff; --ember:#e8853a; --gold:#f0b54c;
  --bgA:#f7f0dd; --bgB:#e6e4bf; --bgC:#cdd7a3; --bgD:#f4d8b0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
    --glass:rgba(30,34,70,.42); --glass2:rgba(40,44,86,.62); --stroke:rgba(255,255,255,.2);
    --shadow:rgba(0,0,0,.35); --sheet:rgba(28,30,62,.88);
    --bgA:#1f2547; --bgB:#3a3a72; --bgC:#c76b6b; --bgD:#f0a36a; --accent:#f2a65a; --on-accent:#2a2414;
  }
}
:root[data-theme="dark"]{
  --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
  --glass:rgba(30,34,70,.42); --glass2:rgba(40,44,86,.62); --stroke:rgba(255,255,255,.2);
  --shadow:rgba(0,0,0,.35); --sheet:rgba(28,30,62,.88);
}
:root[data-tone="light"]{
  --ink:#33341c; --ink2:rgba(51,52,28,.7); --ink3:rgba(51,52,28,.45);
  --glass:rgba(255,252,240,.44); --glass2:rgba(255,252,240,.7); --stroke:rgba(255,255,255,.72);
  --shadow:rgba(84,80,40,.16); --sheet:rgba(251,248,238,.88);
}
:root[data-tone="dark"]{
  --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
  --glass:rgba(30,34,70,.42); --glass2:rgba(44,48,92,.66); --stroke:rgba(255,255,255,.2);
  --shadow:rgba(0,0,0,.35); --sheet:rgba(26,28,58,.9);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bgA);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:transparent;color:var(--ink);font:400 16px/1.45 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

#bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 46% at 12% 8%,var(--bgD),transparent 62%),
    radial-gradient(56% 44% at 92% 28%,var(--bgC),transparent 66%),
    radial-gradient(70% 58% at 28% 98%,var(--bgB),transparent 62%),
    linear-gradient(165deg,var(--bgA),var(--bgB));
  transition:background .6s}
#bg::after{content:"";position:absolute;width:70vmax;height:70vmax;left:-20vmax;top:30%;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--bgD) 55%,transparent),transparent);opacity:.5;filter:blur(30px);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(36vmax,-14vmax) scale(1.15)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}
.wrap{max-width:560px;margin:0 auto}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid var(--stroke);border-radius:24px;
  box-shadow:0 10px 32px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.06)}
.card{padding:16px;margin-top:14px}
.tiny{font-size:12.5px;color:var(--ink3)}
.soft{color:var(--ink2)}
h1{font:400 28px/1.15 var(--fd);letter-spacing:-.01em}
h2{font:400 22px/1.2 var(--fd)}
h3{font:600 15px/1.3 var(--fb);color:var(--ink2);margin:20px 0 10px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:12px}

.btn{appearance:none;border:0;cursor:pointer;font:600 15px var(--fb);color:var(--on-accent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));
  padding:12px 20px;border-radius:999px;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
.btn.sm{padding:9px 14px;font-size:13.5px}
.btn.wide{display:block;width:100%;text-align:center}
.link{appearance:none;background:none;border:0;color:var(--ink2);font:500 14px var(--fb);text-decoration:underline;text-underline-offset:3px;padding:10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:9px 14px;font:500 14px var(--fb);color:var(--ink);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s,background .2s}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip:active{transform:scale(.96)}
.field{width:100%;font:400 16px var(--fb);color:var(--ink);background:var(--glass2);border:1px solid var(--stroke);border-radius:16px;padding:12px 14px;resize:none}
.field::placeholder{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Nav ---------- */
#nav{display:flex;gap:2px;margin:0 12px 10px;padding:6px;border-radius:28px}
#nav button{flex:1;appearance:none;background:none;border:0;border-radius:22px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font:600 11px var(--fb);cursor:pointer;transition:background .2s,color .2s}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--ink);background:var(--glass2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* ---------- Check-in ---------- */
.ci{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 22px 34px;gap:8px}
.ci::before,.ci::after{content:"";flex:1 0 0}
.ci .date{color:var(--ink2);font-size:15px}
.ci h1{font-size:32px;margin-top:4px}
.orbwrap{position:relative;width:260px;height:260px;margin:30px 0 14px;display:grid;place-items:center}
.orbwrap .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);animation:ripple 6s ease-out infinite;opacity:0}
.orbwrap .r2{animation-delay:2s}.orbwrap .r3{animation-delay:4s}
@keyframes ripple{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.05);opacity:0}}
.orb{position:relative;width:176px;height:176px;border-radius:50%;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 34% 28%,#ffe9b8 0,#f4b35a 30%,#dd7434 62%,#9d3f22 100%);
  filter:saturate(.75) brightness(.86);box-shadow:0 0 40px rgba(232,133,58,.25),inset 0 -8px 22px rgba(90,20,0,.35),inset 0 6px 14px rgba(255,255,255,.35);
  animation:breathe 5s ease-in-out infinite;transition:filter .9s,box-shadow .9s,transform .3s}
.orb.hold{transform:scale(1.06);filter:saturate(.9) brightness(.95)}
.orb.lit{filter:none;box-shadow:0 0 56px 8px rgba(240,160,70,.5),inset 0 -8px 22px rgba(90,20,0,.3),inset 0 6px 14px rgba(255,255,255,.5);cursor:default}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.orb .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;filter:drop-shadow(0 4px 10px rgba(80,20,0,.4))}
.orb .prog{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.orb .prog circle{fill:none;stroke:#fff3d0;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:radial-gradient(#fff6d8,#f2a949);animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hint{color:var(--ink2);font-size:15px}
.ci-after{width:100%;max-width:360px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ci-after .big{font:400 44px/1 var(--fd)}
.ci-after .big small{font:500 16px var(--fb);color:var(--ink2);margin-left:6px}
.ci-after .q{margin:22px 0 10px;color:var(--ink2);font-weight:600}
.ci-after .chips{justify-content:center;margin-bottom:12px}
.ci-after .btn{margin-top:14px}

/* ---------- Home ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.top .date{color:var(--ink2);font-size:14px}
.top .tr{display:flex;gap:8px;align-items:center;margin-top:2px}
.coin,.gear{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;height:38px;padding:0 13px;display:flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:600 14.5px var(--fb)}
.gear{width:38px;padding:0;justify-content:center}
.gear svg{width:19px;height:19px}
.streak{padding:16px 16px 14px}
.sk-h{display:flex;align-items:center;gap:14px}
.sk-ic{font-size:38px;line-height:1;filter:drop-shadow(0 4px 12px rgba(232,133,58,.5))}
.sk-n{font:400 34px/1 var(--fd)}
.sk-n small{font:500 15px var(--fb);color:var(--ink2);margin-left:6px}
.sk-h p{font-size:13.5px;color:var(--ink2);margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--ink3);opacity:.7}
.dot.on{border:0;opacity:1;background:radial-gradient(circle at 35% 30%,#fff1c4,#f3b556 45%,#e0782f);box-shadow:0 0 14px rgba(240,160,70,.6)}
.dot.ember{border:0;opacity:1;width:14px;height:14px;margin:5px;background:radial-gradient(circle,#f08a40,#a94a22);box-shadow:0 0 10px rgba(232,133,58,.55);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 5px rgba(232,133,58,.3);opacity:.7}}
.wd.today b{color:var(--ink)}
.intent{margin-top:12px;font-size:14px;color:var(--ink2)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:14px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.banner .bi{font-size:28px}
.banner b{display:block;font-weight:600;font-size:15px}
.banner span.s{font-size:13px;color:var(--ink2)}
.banner.refl{background:linear-gradient(120deg,color-mix(in srgb,#5a4a9a 32%,var(--glass)),color-mix(in srgb,#e98a5a 26%,var(--glass)))}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{appearance:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;border-radius:20px;color:var(--ink);transition:transform .15s,box-shadow .2s}
.cat:active{transform:scale(.97)}
.cat .rg{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:21px}
.cat .rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cat b{display:block;font-weight:600;font-size:14.5px;line-height:1.2}
.cat small{font-size:12px;color:var(--ink2)}
.cat.sel{box-shadow:0 0 0 2px var(--c),0 10px 30px var(--shadow);background:color-mix(in srgb,var(--c) 20%,var(--glass))}
.times{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.times::-webkit-scrollbar{display:none}
.times .chip{flex:none;padding:11px 17px}
.sugg{display:inline-flex;gap:6px;align-items:center;margin:0 0 12px;font-size:13.5px;color:var(--ink2);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.sugg u{text-underline-offset:3px}
.mcard{padding:16px;margin-top:12px;position:relative;overflow:hidden;animation:rise .45s both}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.mcard:nth-child(2){animation-delay:.07s}.mcard:nth-child(3){animation-delay:.14s}
.mtag{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600}
.mtext{font:400 19px/1.35 var(--fd);margin:8px 0 14px}
.macts{display:flex;gap:8px;flex-wrap:wrap}
.macts .btn:first-child{flex:1 1 100%}
.macts .btn.ghost{flex:1}
.later{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:8px;border-radius:18px}
.later p{flex:1;font-size:14.5px}
.later small{display:block;color:var(--ink3);font-size:12px}
.x{appearance:none;border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:6px}

/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(20,18,10,.36);opacity:0;transition:opacity .25s}
.sheet-wrap.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto;max-height:calc(100% - 34px);display:flex;flex-direction:column;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);
  border:1px solid var(--stroke);border-bottom:0;border-radius:30px 30px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.in .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink3);opacity:.5;margin:9px auto 4px;flex:none}
.sbody{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sbody h2{margin-bottom:4px}

.cel{text-align:center;padding-top:6px}
.bloom{width:110px;height:110px}
.bloom circle{fill:none;stroke:var(--accent);stroke-width:2;transform-origin:60px 60px}
.bloom .b1{animation:pulse 1.1s ease-out both}
.bloom .b2{animation:pulse 1.1s .15s ease-out both;opacity:.6}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.15);opacity:0}}
.bloom .core{fill:var(--accent);stroke:none;animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bloom .tick{fill:none;stroke:var(--on-accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.earn{font:600 18px var(--fb);margin-top:2px;animation:rise .5s .7s both}
.lvl{margin:14px 6px 0;text-align:left;animation:rise .5s .8s both}
.lvl-h{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent));transition:width 1.1s .9s cubic-bezier(.2,.8,.2,1)}
.lvup{margin-top:8px;font-weight:600;text-align:center}
.newstamp{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:flip 1s 1.2s both}
@keyframes flip{from{opacity:0;transform:perspective(500px) rotateY(90deg) scale(.8)}to{opacity:1;transform:none}}
.stamp{width:88px;padding:10px 6px 8px;text-align:center;background:#fffaf0;color:#4a4330;border-radius:3px;
  box-shadow:0 6px 16px rgba(60,50,20,.25);outline:2px dashed rgba(120,100,60,.4);outline-offset:-6px;transform:rotate(-2deg)}
.stamp .e{font-size:38px;line-height:1.2}
.stamp small{display:block;font-size:11px;line-height:1.2;margin-top:2px;font-weight:600}
.stamp.off{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink3);box-shadow:none;outline-color:var(--ink3);transform:none}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}
.mode span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.mode.on{background:var(--accent)}.mode.on span{color:var(--on-accent)}
.panel{margin-top:10px;display:grid;gap:8px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:26px;transition:transform .15s}
.rate span{font-size:11px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15}
.rate.on{background:color-mix(in srgb,var(--accent) 34%,var(--glass2));box-shadow:0 0 0 2px var(--accent);transform:scale(1.04)}
.preview{margin-top:12px}

/* Reflexión */
.refl{text-align:center}
.refl .face{font-size:84px;line-height:1.1;margin-top:8px;transition:transform .25s}
.refl .word{font:400 22px var(--fd);margin:2px 0 14px}
.sky{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:14px;outline:0;
  background:linear-gradient(90deg,#4b5b8f,#8a90b8,#f0c98a,#f4a35c,#f27fa0)}
.sky::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.sky::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.refl .q{margin:20px 0 10px;color:var(--ink2);font-weight:600}
.refl .chips{justify-content:center}
.refl .field{margin:14px 0}

/* ---------- Momentos ---------- */
.seg{display:flex;padding:4px;border-radius:999px;gap:2px;margin-bottom:14px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:999px;padding:9px 6px;font:600 14px var(--fb);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px var(--shadow)}
.navr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.navr b{font:400 18px var(--fd)}
.navr button{appearance:none;background:var(--glass);border:1px solid var(--stroke);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.navr button:disabled{opacity:.3}
.chapter{padding:22px 20px;position:relative;overflow:hidden;border-radius:26px}
.chapter h2{font-size:26px;line-height:1.15;color:#2d2e18;max-width:85%}
.chapter p{color:rgba(45,46,24,.7);font-size:14px;margin-top:6px}
.chapter .btn{position:absolute;right:14px;bottom:14px}
.chapter.dk h2{color:#fff8e6}.chapter.dk p{color:rgba(255,248,230,.75)}

const ENDOW=1;
function level(min){
  const m=min+ENDOW;let i=0;while(i<LV.length-1&&m>=LV[i+1])i++;const nx=LV[i+1];
  return {i:i,name:LVN[i],next:nx?LVN[i+1]:'',left:nx?Math.max(0,nx-m):0,frac:nx?(m-LV[i])/(nx-LV[i]):1};
}

function firstDay(){const k=Object.keys(S.checkins).sort();return k[0]||null;}

  if(first){const t=today();let d=first,n=0;while(d<t&&n<4000){if(!S.checkins[d])br++;d=addDays(d,1);n++;}}

function catMin(c){return S.log.filter(e=>e.cat===c).reduce((a,e)=>a+e.t,0);}
function catScore(c){const l=S.log.filter(e=>e.cat===c&&e.rate).slice(-20);if(!l.length)return 0;return l.reduce((a,e)=>a+RV[e.rate],0)/l.length;}
function mScore(id){let s=0;S.log.forEach(e=>{if(e.mid===id&&e.rate&&S.forgot.indexOf(id)<0)s+=RV[e.rate];});return clamp(s,-3,3);}
function weight(m,t){
  let w=(m.t===t?5:1)*(m.custom?1.6:1)*Math.max(.15,1+.45*mScore(m.id))*Math.max(.6,1+.4*catScore(m.cat));
  const tm=S.tune[m.id];if(tm==='more')w*=2.2;else if(tm==='less')w*=.12;
  const ct=S.catTune[m.cat];if(ct==='more')w*=1.5;else if(ct==='less')w*=.4;
  if(m.cat===season().cat)w*=1.25;
  const it=S.intents.sem;if(it&&it.ws===weekStart(0)&&it.cat===m.cat)w*=1.35;
  const recent=S.log.some(e=>e.mid===m.id&&e.d>=addDays(today(),-3));
  return recent?w*.35:w;
}
function wpick(list,n,wf){
  const arr=list.slice(),out=[];
  while(out.length<n&&arr.length){
    const ws=arr.map(wf),sum=ws.reduce((a,b)=>a+b,0);let r=Math.random()*sum,i=0;
    for(;i<arr.length;i++){r-=ws[i];if(r<=0)break;}
    if(i>=arr.length)i=arr.length-1;out.push(arr.splice(i,1)[0]);
  }
  return out;
}
function poolFor(cat,t){const o=[];TIMES.forEach(tt=>{if(tt<=t)MIS[cat][tt].forEach(m=>o.push(m));});return o;}
function deal(cat,t){
  const lt=new Set(S.later.map(l=>l.mid));
  let p=poolFor(cat,t).filter(m=>!lt.has(m.id));if(p.length<3)p=poolFor(cat,t);
  return {cat:cat,t:t,cards:wpick(p,3,m=>weight(m,t))};
}
function swapCard(i){
  const d=U.deck,cur=new Set(d.cards.map(m=>m.id)),dn=new Set(S.log.filter(e=>e.d===today()).map(e=>e.mid)),lt=new Set(S.later.map(l=>l.mid));
  const ok=m=>!cur.has(m.id)&&!lt.has(m.id);
  let c=poolFor(d.cat,d.t).filter(m=>ok(m)&&!dn.has(m.id));
  if(!c.length)c=poolFor(d.cat,d.t).filter(ok);
  if(!c.length)c=ALL.filter(m=>m.t===d.t&&m.cat!==d.cat&&ok(m)&&!dn.has(m.id));
  if(!c.length)return false;
  d.cards[i]=wpick(c,1,m=>weight(m,d.t))[0];return true;
}

const HOUR_AFF={
 am:{energia:1.6,presencia:1.5,curiosidad:1.3,cuidado:1.3,exploracion:1.1},
 mid:{conexion:1.5,disfrute:1.4,exploracion:1.3,curiosidad:1.2,energia:1.2},

 night:{calma:2,cuidado:1.6}
};
const HOUR_T={
 am:{1:1,5:1.6,15:1.6,30:1.1,60:.4},
 mid:{1:1,5:1.5,15:1.6,30:1,60:.35},
 pm:{1:.9,5:1.4,15:1.6,30:1.2,60:.5},
 eve:{1:1.1,5:1.6,15:1.5,30:.9,60:.3},
 night:{1:2,5:2,15:.8,30:.1,60:.02}
};
const MOOD_AFF=[
 {exploracion:1.5,valentia:1.5,creatividad:1.4,conexion:1.3,curiosidad:1.2},
 {disfrute:1.3,conexion:1.3,creatividad:1.2,exploracion:1.2},
 {presencia:1.4,energia:1.4,disfrute:1.3,cuidado:1.2},
 {calma:2,cuidado:1.7,disfrute:1.4,energia:1.2,valentia:.4},
 {calma:2,presencia:1.6,cuidado:1.5,valentia:.5,exploracion:.7}
];
const MOOD_T=[
 {1:.6,5:1.3,15:2,30:1.6,60:.8},
 {1:.8,5:1.5,15:2,30:1.2,60:.5},
 {1:1.2,5:2,15:1.6,30:.7,60:.2},
 {1:2,5:2.2,15:1.2,30:.3,60:.05},
 {1:2,5:2.2,15:1.1,30:.3,60:.05}
];
const BUCKET_TXT={am:'esta mañana',mid:'a mediodía',pm:'esta tarde',eve:'esta noche',night:'antes de dormir'};
function hourBucket(h){return h>=5&&h<11?'am':h<15&&h>=11?'mid':h>=15&&h<19?'pm':h>=19&&h<23?'eve':'night';}
function hashStr(s){let x=7;for(let i=0;i<s.length;i++)x=(Math.imul(x,31)+s.charCodeAt(i))|0;return x;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function spick(list,wf,rng){
  const ws=list.map(wf),sum=ws.reduce((a,b)=>a+b,0);let r=rng()*sum,i=0;
  for(;i<list.length;i++){r-=ws[i];if(r<=0)break;}
  return list[Math.min(i,list.length-1)];
}
function momentSug(){
  const now=new Date(),b=hourBucket(now.getHours()),c=S.checkins[today()],mood=c&&c.mood!=null?c.mood:null;
  const hard=hardToday()&&!U.hardMore,ph=expPhase(),st=ph&&ph.style?EXP_STYLES[ph.style]:null;
  const done=new Set(S.log.filter(e=>e.d===today()).map(e=>e.mid)),lt=new Set(S.later.map(l=>l.mid));
  const key=[today(),b,mood,U.sugN,done.size,ALL.length,lt.size,hard,ph&&ph.style].join('|');
  if(U.sug&&U.sug.key===key)return U.sug;
  let cand=ALL.filter(m=>!done.has(m.id)&&!lt.has(m.id));
  if(hard){const c1=cand.filter(m=>m.t===1);if(c1.length>=2)cand=c1;}
  if(!cand.length)return null;
  const acc=accRates();
  const wf=m=>{
    let s=weight(m,m.t)*(HOUR_AFF[b][m.cat]||1)*HOUR_T[b][m.t]*(1+clamp((acc[m.cat]-.333)*.6,-.3,.4));
    if(mood!=null)s*=(MOOD_AFF[mood][m.cat]||1)*MOOD_T[mood][m.t];
    if(st)s*=st.T[m.t];
    return Math.pow(Math.max(s,.001),1.6);
  };
  const rng=mulberry(hashStr(key)),first=spick(cand,wf,rng);
  let rest=cand.filter(m=>m.id!==first.id&&m.cat!==first.cat);if(!rest.length)rest=cand.filter(m=>m.id!==first.id);
  const items=[{m:first,reason:reasonFor(first,b,mood,hard)}];
  if(rest.length){const s2=spick(rest,wf,rng);items.push({m:s2,reason:reasonFor(s2,b,mood,hard)});}
  U.sug={key:key,items:items};return U.sug;
}

const SEASONS=[
 {id:'hojas',n:'Temporada de las hojas',cat:'presencia',theme:'otono',line:'Bajar el ritmo y notar lo que cae y lo que se queda.'},

const EPOCH='2026-01-05';
function season(d){
  const days=Math.round((parseD(d||today())-parseD(EPOCH))/86400000),w=Math.floor(days/7),idx=Math.floor(w/4);
  const base=SEASONS[((idx%4)+4)%4],wk=(((w%4)+4)%4)+1;
  return Object.assign({},base,{idx:idx,wk:wk,start:addDays(EPOCH,idx*28),end:addDays(EPOCH,idx*28+27)});
}
function themeAvail(id){return season().theme===id;}
function themeWhen(id){
  const days=Math.round((parseD(today())-parseD(EPOCH))/86400000),w=Math.floor(days/7),idx=Math.floor(w/4);
  for(let k=1;k<=4;k++){if(SEASONS[(idx+k)%4].theme===id){const wks=(idx+k)*4-w;return 'Vuelve en '+wks+(wks===1?' semana':' semanas');}}
  return 'En otra temporada';
}
function hardToday(){

function last30(){

  return {ci:ci,viv:viv};
}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}

function accRates(){
  const sh={},ch={};
  S.sugLog.slice(-60).forEach(x=>{
    x.shown.forEach(id=>{const m=MID[id];if(m)sh[m.cat]=(sh[m.cat]||0)+1;});
    if(x.chose){const m=MID[x.chose];if(m)ch[m.cat]=(ch[m.cat]||0)+1;}
  });
  const r={};CATS.forEach(c=>{r[c.id]=((ch[c.id]||0)+1)/((sh[c.id]||0)+3);});return r;
}
function reasonFor(m,b,mood,hard){
  if(hard)return 'Hoy basta con un minuto.';
  const ms=mScore(m.id),cs=catScore(m.cat),it=S.intents.sem;
  if(ms>=.8||cs>=.5)return 'Te ha encantado algo así.';
  if(it&&it.ws===weekStart(0)&&it.cat===m.cat)return 'Va con tu intención de la semana.';
  if(m.cat===season().cat)return 'Es el enfoque de la temporada.';
  if(m.custom)return 'Una de las tuyas.';
  if(mood===3)return 'Llegaste con el día pesado: algo suave.';
  if(mood===4)return 'Llegaste revuelto: algo para asentarte.';
  if(mood===0)return 'Llegaste ligero: buen momento para esto.';
  return 'Buena idea '+BUCKET_TXT[b]+'.';
}

function ac(){

    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}

function blip(f,t0,d,v,type,glide){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(glide)o.frequency.exponentialRampToValueAtTime(glide,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}

    stamp:()=>{blip(1319,0,.25,.035,'triangle');blip(1568,.07,.3,.03,'triangle');}

function holdStart(){

  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;
  o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(270,t+1.2);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.05,t+.5);
  o.connect(g);g.connect(c.destination);o.start();holdN={o:o,g:g};
}
function holdStop(){
  if(!holdN||!AC)return;
  try{const t=AC.currentTime;holdN.g.gain.cancelScheduledValues(t);holdN.g.gain.setValueAtTime(Math.max(holdN.g.gain.value,.0001),t);holdN.g.gain.linearRampToValueAtTime(.0001,t+.15);holdN.o.stop(t+.2);}catch(e){}

function fxResize(){const cv=$('#fx');const d=Math.min(window.devicePixelRatio||1,2);fx.w=window.innerWidth;fx.h=window.innerHeight;cv.width=fx.w*d;cv.height=fx.h*d;cv.getContext('2d').setTransform(d,0,0,d,0,0);}
function mkPart(mode,init){
  const p={x:Math.random()*fx.w,y:init?Math.random()*fx.h:-30};
  if(mode==='leaves'){p.s=14+Math.random()*12;p.vy=.35+Math.random()*.7;p.ph=Math.random()*6;p.r=Math.random()*6;p.vr=(Math.random()-.5)*.03;p.e=Math.random()<.5?'🍂':'🍁';}
  else if(mode==='rain'){p.l=10+Math.random()*16;p.vy=9+Math.random()*7;p.x=Math.random()*(fx.w+40);}
  else{p.r=6+Math.random()*24;p.y=init?Math.random()*fx.h:fx.h+30;p.vy=-(.12+Math.random()*.3);p.ph=Math.random()*6;p.col=mode==='bokeh'?['#ff77b7','#6fe0ff','#ffc35a','#a98bff'][rnd(4)]:['#ffd08a','#ff9f7a','#ffe7b0'][rnd(3)];p.a=.08+Math.random()*.16;}
  return p;
}
function fxLoop(){
  const cv=$('#fx'),c=cv.getContext('2d');c.clearRect(0,0,fx.w,fx.h);const t=performance.now()/1000;
  fx.parts.forEach((p,i)=>{
    if(fx.mode==='leaves'){p.y+=p.vy;p.x+=Math.sin(t+p.ph)*.6;p.r+=p.vr;if(p.y>fx.h+30)fx.parts[i]=mkPart('leaves');c.save();c.translate(p.x,p.y);c.rotate(p.r+Math.sin(t*.8+p.ph)*.4);c.globalAlpha=.75;c.font=p.s+'px serif';c.textAlign='center';c.fillText(p.e,0,0);c.restore();}
    else if(fx.mode==='rain'){p.y+=p.vy;p.x-=1.4;if(p.y>fx.h+20)fx.parts[i]=mkPart('rain');c.strokeStyle='rgba(190,220,255,.32)';c.lineWidth=1.1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-1.6,p.y+p.l);c.stroke();}
    else{p.y+=p.vy;p.x+=Math.sin(t*.4+p.ph)*.25;if(p.y<-40)fx.parts[i]=mkPart(fx.mode);const a=p.a*(.7+.3*Math.sin(t+p.ph));const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,p.col);g.addColorStop(1,'transparent');c.globalAlpha=a*2.4;c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1;}
  });
  fx.raf=requestAnimationFrame(fxLoop);
}
function setFx(mode){
  if(fx.mode===mode)return;fx.mode=mode;cancelAnimationFrame(fx.raf);fxResize();
  const c=$('#fx').getContext('2d');c.clearRect(0,0,fx.w,fx.h);
  if(!mode||reduced){fx.parts=[];return;}
  const n=mode==='rain'?70:mode==='leaves'?20:22;
  fx.parts=[];for(let i=0;i<n;i++)fx.parts.push(mkPart(mode,true));
  fxLoop();
}

function gapDays(){
  const k=Object.keys(S.checkins).sort();if(!k.length)return 0;

function bindCI(){
  const orb=$('#orb');if(!orb)return;
  if(orb.classList.contains('lit')){$('#ci-after').innerHTML=ciAfter();return;}
  const prog=$('#prog'),em=$('#embers');let raf=0,start=0,holding=false,lastTick=0;
  const setP=p=>{if(em)em.style.setProperty('--p',String(p));};
  const step=()=>{
    if(!holding)return;
    const now=performance.now(),p=Math.min(1,(now-start)/1200);
    prog.style.strokeDashoffset=String(100-p*100);setP(p);
    if(now-lastTick>260){lastTick=now;buzz(5);}
    if(p>=1){holding=false;holdStop();ignite();return;}
    raf=requestAnimationFrame(step);
  };
  orb.addEventListener('pointerdown',e=>{
    if(orb.classList.contains('lit'))return;
    e.preventDefault();holding=true;start=performance.now();lastTick=start;
    prog.style.transition='none';orb.classList.add('hold');holdStart();
    try{orb.setPointerCapture(e.pointerId);}catch(_){}
    raf=requestAnimationFrame(step);
  });
  const stop=()=>{
    if(!holding)return;holding=false;cancelAnimationFrame(raf);holdStop();
    orb.classList.remove('hold');prog.style.transition='stroke-dashoffset .5s ease';prog.style.strokeDashoffset='100';setP(0);
  };
  orb.addEventListener('pointerup',stop);orb.addEventListener('pointercancel',stop);
  orb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ignite();}});
  orb.addEventListener('contextmenu',e=>e.preventDefault());
}
function ignite(){
  const orb=$('#orb');if(!orb||orb.classList.contains('lit'))return;
  const gap=U.ciGap||0;
  doCheckin();U.ciOpen=true;orb.classList.remove('hold');orb.classList.add('lit');
  const em=$('#embers');if(em){em.style.setProperty('--p','1');em.classList.add('in');}
  if(gap>=2){orb.classList.add('flare');const fl=document.createElement('div');fl.className='flash';$('.ci').appendChild(fl);setTimeout(()=>fl.remove(),1800);}
  const pr=$('#prog');pr.style.transition='stroke-dashoffset .3s';pr.style.strokeDashoffset='0';
  const sp=$('#sparks'),ns=22+Math.min(gap,12)*3;
  for(let i=0;i<ns;i++){const a=Math.random()*Math.PI*2,d=90+Math.random()*90;const s=document.createElement('i');s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');sp.appendChild(s);}
  setTimeout(()=>{sp.innerHTML='';},1400);
  buzz(gap>=2?[30,50,30,50,90]:[30,40,60]);sfx('ignite');
  $('#hint').hidden=true;$('#skipbtn').hidden=true;
  $('#ci-after').innerHTML=ciAfter();
  const el=$('#count'),n=stats().streak,t0=performance.now();
  const tick=()=>{const p=Math.min(1,(performance.now()-t0)/900);el.textContent=String(Math.max(1,Math.round(n*(1-Math.pow(1-p,3)))));if(p<1)requestAnimationFrame(tick);};tick();
}

    const mx=Math.max.apply(null,sm.ranked.map(c=>sm.by[c.id].min));
    o+='<section class="glass card"><h3 style="margin-top:0">Lo que más viviste</h3>'+sm.ranked.slice(0,4).map(c=>'<div class="brow" style="--c:'+c.c+'"><span>'+c.e+' '+c.n+'</span><div class="bar"><i style="width:'+Math.max(8,sm.by[c.id].min/mx*100)+'%"></i></div></div>').join('')+'<p class="tiny" style="margin-top:10px">Dedicaste '+minText(sm.mins)+' a estar presente.</p></section>';
  }
  if(sm.refl.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Cómo se sintieron tus días</h3><p style="font:400 24px var(--fd)">'+FACE[sm.avg-1]+' '+FWORD[sm.avg-1]+'</p><p class="tiny" style="margin-top:4px">Cerraste '+(sm.refl.length===1?'un día':sm.refl.length+' días')+' con una reflexión.</p></section>';
  }
  if(sm.moms.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Momentos guardados</h3><div class="mosaic">'+sm.moms.slice(0,6).map((e,i)=>tileFor(e,i)).join('')+'</div></section>';
  }
  if(sm.loved.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Para repetir</h3><p class="quote">“'+esc(sm.loved[0])+'”</p><p class="tiny" style="margin-top:8px">Te encantó. Puedes repetirla o buscar algo parecido.</p></section>';
  }
  if(!sm.ent.length&&!sm.ci)o+='<p class="empty" style="margin-top:14px">Cuando vivas algo, aquí aparecerá con calma.</p>';
  o+=pulseRes(kind)+caminoCard();
  return o;
}

/* ============ Tienda ============ */
function isEq(it){
  const E=S.equip;
  if(it.k==='theme')return E.theme===it.id;
  if(it.k==='bg')return E.bg===it.id&&!E.theme;
  if(it.k==='pal')return E.pal===it.id&&!E.theme;
  if(it.k==='icon')return E.icon===it.id;
  if(it.k==='frame')return E.frame===it.id;
  if(it.k==='coll')return E.coll===it.id;
  return false;
}
function preview(it){
  const g=c=>'background:linear-gradient(135deg,'+c[0]+','+c[1]+','+c[2]+','+c[3]+')';
  if(it.k==='theme'||it.k==='bg'||it.k==='pal'){
    if(!it.c)return '<div class="pv glass" style="font-size:22px">'+(it.k==='pal'?'🌗':'✦')+'</div>';
    return '<div class="pv" style="'+g(it.c)+'">'+(it.fx==='leaves'?'🍂':it.fx==='rain'?'🌧️':it.fx==='bokeh'?'🌃':it.fx==='glow'?'🌇':'')+'</div>';
  }
  if(it.k==='icon')return '<div class="pv glass">'+it.e+'</div>';
  if(it.k==='frame')return '<div class="pv glass"><div class="ph'+(it.id!=='none'?' fr-'+it.id:'')+'"><div class="fake"></div></div></div>';
  if(it.k==='chap')return '<div class="pv" style="background:linear-gradient(135deg,'+it.cover[0]+','+it.cover[1]+');font:400 11px/1.2 var(--fd);padding:6px;text-align:center;color:'+(it.dk?'#fff8e6':'#2d2e18')+'">'+esc(it.n)+'</div>';
  if(it.k==='coll')return '<div class="pv"><div class="pvq"><i style="background:'+it.g[0]+'"></i><i style="background:'+it.g[1]+'"></i><i style="background:'+it.g[2]+'"></i><i style="background:'+it.g[3]+'"></i></div></div>';
  return '<div class="pv glass">'+it.e+'</div>';
}
function viewTie(){
  let o='<h1 style="margin-bottom:14px">Tienda</h1><section class="glass wallet"><div><b>'+S.coins+'</b> <span class="soft">monedas</span><p class="tiny" style="margin-top:4px">Las monedas llegan solas cuando vives una misión. Sirven para decorar.</p></div><span style="font-size:38px">🪙</span></section>';
  SECS.forEach(sc=>{
    const list=ITEMS.filter(i=>i.k===sc[0]);
    o+='<section class="sec"><h2>'+sc[1]+'</h2>'+(sc[2]?'<p class="tiny" style="margin:-6px 0 10px">'+sc[2]+'</p>':'')+'<div class="hscroll">'+list.map(it=>{
      const own=owns(it.k,it.id)||it.p===0,eq=isEq(it);
      let btn;
      if(it.k==='theme'&&!own&&!themeAvail(it.id))btn='<button class="btn ghost" disabled>'+themeWhen(it.id)+'</button>';
      else if(it.k==='pack')btn='<button class="btn" data-a="buy" data-k="'+it.k+'" data-id="'+it.id+'">🪙 '+it.p+'</button>';
      else if(!own)btn='<button class="btn ghost" data-a="buy" data-k="'+it.k+'" data-id="'+it.id+'">🪙 '+it.p+'</button>';
      else if(it.k==='chap')btn='<button class="btn ghost" disabled style="opacity:.7">Tuyo</button>';
      else if(it.k==='page')btn='<button class="btn ghost" disabled style="opacity:.7">Desbloqueado</button>';
      else btn='<button class="btn'+(eq?' ghost':'')+'" data-a="equip" data-k="'+it.k+'" data-id="'+it.id+'">'+(eq?(it.k==='theme'||it.k==='coll'?'Quitar':'En uso'):(it.k==='theme'?'Activar':'Usar'))+'</button>';
      return '<div class="item glass'+(eq?' eq':'')+'">'+preview(it)+'<b>'+esc(it.n)+'</b><small>'+esc(it.k==='theme'&&themeAvail(it.id)?'De esta temporada':(it.d||''))+'</small>'+btn+'</div>';

function buy(k,id){
  const it=IT(k,id);if(!it)return;
  if(k==='theme'&&!owns(k,id)&&!themeAvail(id)){toast('Ese tema llega con su temporada.');return;}
  if(S.coins<it.p){toast('Ese tema cuesta '+it.p+' monedas; llegarán con tus misiones.');return;}
  if(k==='pack'){
    const free=allFree();if(!free.length){toast('Ya tienes todas las estampillas ✨');return;}
    const key=free[rnd(free.length)];S.coins-=it.p;S.stamps.push(key);save();sfx('stamp');buzz(12);
    const s=stampOf(key);
    U.sh={kind:'pack'};
    openSheet('<div class="cel" style="padding:10px 0 6px"><h2>Tu estampilla nueva</h2><div class="newstamp" style="animation-delay:.1s">'+stampCard(key)+'<p class="tiny">'+CAT[key.split(':')[0]].n+'</p></div><button class="btn wide" style="margin-top:22px" data-a="closeSheet">Guardarla en el álbum</button></div>');
    return;
  }
  S.coins-=it.p;S.owned.push(k+':'+id);sfx('buy');buzz(12);
  if(k!=='chap'&&k!=='page'){equipItem(k,id,true);}
  save();toast(it.n+' ya es tuyo');render();
}
function equipItem(k,id,silent){
  const E=S.equip;
  if(k==='theme')E.theme=E.theme===id&&!silent?'':id;
  else if(k==='bg'){E.bg=id;E.theme='';}
  else if(k==='pal'){E.pal=id;E.theme='';}
  else if(k==='icon')E.icon=id;
  else if(k==='frame')E.frame=id;
  else if(k==='coll')E.coll=E.coll===id&&!silent?'':id;
}

async function saveBlob(name,blob,noShare){
  try{
    if(!noShare&&canShareFiles()){await navigator.share({files:[new File([blob],name,{type:blob.type})],title:name});return 'shared';}
  }catch(e){if(e&&e.name==='AbortError')return 'cancel';}

  c.fillStyle=ink2;c.font='500 38px '+SANS;c.textAlign='center';c.fillText(IT('icon',S.equip.icon).e+'  Presente',W/2,H-90);
  return await new Promise(res=>cv.toBlob(bl=>res(bl),'image/png'));
}

 edCancel(){U.ed=edDefaults();U.f.edtext='';edRefresh(true);},

  edSync();const text=(U.ed.text||'').trim();if(!text){toast('Escribe la misión primero');return;}

  else if(e.id){const c=S.custom.find(x=>x.id===e.id);if(c){c.text=text;c.cat=e.cat;c.t=e.t;c.mini=(e.mini||'').trim();}}

  U.edCat=e.cat;U.ed=Object.assign(edDefaults(),{cat:e.cat,t:e.t});U.f.edtext='';U.f.edmini='';

  try{

   S.backup.last=today();save();
   const b=$('#bklast');if(b)b.textContent=lastBackupText();

 saveName(){S.name=(U.f.name||'').trim();save();toast('Listo');closeSheet();},

const QUIET=new Set(['done','sugDone','laterDo','buy','saveRefl','storyNext','storyPrev','closeSheet','testFx','exportFile']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;if(!QUIET.has(a)){buzz(6);sfx('tap');}
  const f=A[a];if(f){f(el,e);}
});
document.addEventListener('keydown',e=>{
  if(!U.story)return;
  if(e.key==='ArrowRight'||e.key===' ')A.storyNext();
  else if(e.key==='ArrowLeft')A.storyPrev();
  else if(e.key==='Escape')A.storyClose();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.bind)U.f[t.dataset.bind]=t.value;
  if(t.id==='rrange'&&U.sh&&U.sh.kind==='refl'){
    const v=+t.value;U.sh.r=v;$('#rface').textContent=FACE[v-1];$('#rword').textContent=FWORD[v-1];
    const sh=$('.sheet');if(sh)sh.style.boxShadow='0 -20px 60px '+FTINT[v-1]+'66,inset 0 1px 0 rgba(255,255,255,.4)';
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='reflnow'){S.dev.reflNow=t.checked;save();}
  if(t.id==='hapt'){S.prefs.haptics=t.checked;save();if(t.checked)buzz(15);}
  if(t.id==='snd'){S.prefs.sound=t.checked;save();if(t.checked)sfx('done');}
  if(t.id==='calm'){S.prefs.calm=t.checked;if(t.checked&&U.tab==='tie')U.tab='hoy';save();render();}
  if(t.id==='bday'){S.birthday=t.value?t.value.slice(5):'';save();toast('Listo');}
  if(t.id==='bfile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>previewImport(String(fr.result));fr.onerror=()=>toast('No pude leer ese archivo');fr.readAsText(t.files[0]);t.value='';}
  if(t.id==='file'&&t.files&&t.files[0]&&U.sh&&U.sh.kind==='complete'){
    const file=t.files[0],s=U.sh;
    readPhoto(file).then(url=>{const e=S.log.find(x=>x.id===s.id);const key='ph_'+e.id;idbPut(key,url);e.moment=e.moment||{};e.moment.photo=key;save();if(U.sh===s)refreshRest();}).catch(()=>toast('No pude leer esa foto'));
  }
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&U.day!==today()){U.day=today();U.skipCI=false;U.ciOpen=false;U.mOff=0;U.wOff=0;U.sOff=0;U.sug=null;U.sugN=0;render();}
});

/* ============ Arranque ============ */
if(!document.querySelector('link[rel=apple-touch-icon]'))makeIcon();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
Promise.race([idbOpen().then(idbAll),new Promise(r=>setTimeout(r,2500))]).then(()=>{
  // Migrar el respaldo de fotos huérfanas no es necesario: se cargan por clave
  render();
});
})();
