<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presente</title>
<meta name="description" content="Un acompañante diario para estar presente, curioso y cerca de los tuyos.">
<meta name="theme-color" content="#f6efdc">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Presente">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --fd:'Young Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --fb:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ink:#33341c; --ink2:rgba(51,52,28,.7); --ink3:rgba(51,52,28,.45);
  --glass:rgba(255,252,240,.44); --glass2:rgba(255,252,240,.7); --stroke:rgba(255,255,255,.72);
  --shadow:rgba(84,80,40,.16); --sheet:rgba(251,248,238,.86);
  --accent:#66792c; --on-accent:#ffffff; --ember:#e8853a; --gold:#f0b54c;
  --bgA:#f7f0dd; --bgB:#e6e4bf; --bgC:#cdd7a3; --bgD:#f4d8b0;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
    --glass:rgba(30,34,70,.42); --glass2:rgba(40,44,86,.62); --stroke:rgba(255,255,255,.2);
    --shadow:rgba(0,0,0,.35); --sheet:rgba(28,30,62,.88);
    --bgA:#1f2547; --bgB:#3a3a72; --bgC:#c76b6b; --bgD:#f0a36a; --accent:#f2a65a; --on-accent:#2a2414;
  }
}
:root[data-theme="dark"]{
  --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
  --glass:rgba(30,34,70,.42); --glass2:rgba(40,44,86,.62); --stroke:rgba(255,255,255,.2);
  --shadow:rgba(0,0,0,.35); --sheet:rgba(28,30,62,.88);
}
:root[data-tone="light"]{
  --ink:#33341c; --ink2:rgba(51,52,28,.7); --ink3:rgba(51,52,28,.45);
  --glass:rgba(255,252,240,.44); --glass2:rgba(255,252,240,.7); --stroke:rgba(255,255,255,.72);
  --shadow:rgba(84,80,40,.16); --sheet:rgba(251,248,238,.88);
}
:root[data-tone="dark"]{
  --ink:#f6eddc; --ink2:rgba(246,237,220,.74); --ink3:rgba(246,237,220,.46);
  --glass:rgba(30,34,70,.42); --glass2:rgba(44,48,92,.66); --stroke:rgba(255,255,255,.2);
  --shadow:rgba(0,0,0,.35); --sheet:rgba(26,28,58,.9);
}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--bgA);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:transparent;color:var(--ink);font:400 16px/1.45 var(--fb);overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}

#bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60% 46% at 12% 8%,var(--bgD),transparent 62%),
    radial-gradient(56% 44% at 92% 28%,var(--bgC),transparent 66%),
    radial-gradient(70% 58% at 28% 98%,var(--bgB),transparent 62%),
    linear-gradient(165deg,var(--bgA),var(--bgB));
  transition:background .6s}
#bg::after{content:"";position:absolute;width:70vmax;height:70vmax;left:-20vmax;top:30%;border-radius:50%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--bgD) 55%,transparent),transparent);opacity:.5;filter:blur(30px);animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(36vmax,-14vmax) scale(1.15)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}
.wrap{max-width:560px;margin:0 auto}

.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid var(--stroke);border-radius:24px;
  box-shadow:0 10px 32px var(--shadow),inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.06)}
.card{padding:16px;margin-top:14px}
.tiny{font-size:12.5px;color:var(--ink3)}
.soft{color:var(--ink2)}
h1{font:400 28px/1.15 var(--fd);letter-spacing:-.01em}
h2{font:400 22px/1.2 var(--fd)}
h3{font:600 15px/1.3 var(--fb);color:var(--ink2);margin:20px 0 10px}
.sec{margin-top:26px}
.sec>h2{margin-bottom:12px}

.btn{appearance:none;border:0;cursor:pointer;font:600 15px var(--fb);color:var(--on-accent);
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 84%,#fff),var(--accent));
  padding:12px 20px;border-radius:999px;
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--glass2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--stroke)}
.btn.sm{padding:9px 14px;font-size:13.5px}
.btn.wide{display:block;width:100%;text-align:center}
.link{appearance:none;background:none;border:0;color:var(--ink2);font:500 14px var(--fb);text-decoration:underline;text-underline-offset:3px;padding:10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;padding:9px 14px;font:500 14px var(--fb);color:var(--ink);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s,background .2s}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.chip:active{transform:scale(.96)}
.field{width:100%;font:400 16px var(--fb);color:var(--ink);background:var(--glass2);border:1px solid var(--stroke);border-radius:16px;padding:12px 14px;resize:none}
.field::placeholder{color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Nav ---------- */
#nav{display:flex;gap:2px;margin:0 12px 10px;padding:6px;border-radius:28px}
#nav button{flex:1;appearance:none;background:none;border:0;border-radius:22px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink3);font:600 11px var(--fb);cursor:pointer;transition:background .2s,color .2s}
#nav button svg{width:23px;height:23px}
#nav button.on{color:var(--ink);background:var(--glass2);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* ---------- Check-in ---------- */
.ci{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 22px 34px;gap:8px}
.ci::before,.ci::after{content:"";flex:1 0 0}
.ci .date{color:var(--ink2);font-size:15px}
.ci h1{font-size:32px;margin-top:4px}
.orbwrap{position:relative;width:260px;height:260px;margin:30px 0 14px;display:grid;place-items:center}
.orbwrap .ring{position:absolute;inset:0;border-radius:50%;border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);animation:ripple 6s ease-out infinite;opacity:0}
.orbwrap .r2{animation-delay:2s}.orbwrap .r3{animation-delay:4s}
@keyframes ripple{0%{transform:scale(.55);opacity:.7}100%{transform:scale(1.05);opacity:0}}
.orb{position:relative;width:176px;height:176px;border-radius:50%;border:0;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  background:radial-gradient(circle at 34% 28%,#ffe9b8 0,#f4b35a 30%,#dd7434 62%,#9d3f22 100%);
  filter:saturate(.75) brightness(.86);box-shadow:0 0 40px rgba(232,133,58,.25),inset 0 -8px 22px rgba(90,20,0,.35),inset 0 6px 14px rgba(255,255,255,.35);
  animation:breathe 5s ease-in-out infinite;transition:filter .9s,box-shadow .9s,transform .3s}
.orb.hold{transform:scale(1.06);filter:saturate(.9) brightness(.95)}
.orb.lit{filter:none;box-shadow:0 0 56px 8px rgba(240,160,70,.5),inset 0 -8px 22px rgba(90,20,0,.3),inset 0 6px 14px rgba(255,255,255,.5);cursor:default}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.orb .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;filter:drop-shadow(0 4px 10px rgba(80,20,0,.4))}
.orb .prog{position:absolute;inset:-12px;width:calc(100% + 24px);height:calc(100% + 24px);transform:rotate(-90deg);pointer-events:none}
.orb .prog circle{fill:none;stroke:#fff3d0;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:100 100;stroke-dashoffset:100}
.sparks{position:absolute;inset:0;pointer-events:none}
.sparks i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3px;border-radius:50%;background:radial-gradient(#fff6d8,#f2a949);animation:spark 1.2s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.hint{color:var(--ink2);font-size:15px}
.ci-after{width:100%;max-width:360px;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ci-after .big{font:400 44px/1 var(--fd)}
.ci-after .big small{font:500 16px var(--fb);color:var(--ink2);margin-left:6px}
.ci-after .q{margin:22px 0 10px;color:var(--ink2);font-weight:600}
.ci-after .chips{justify-content:center;margin-bottom:12px}
.ci-after .btn{margin-top:14px}

/* ---------- Home ---------- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.top .date{color:var(--ink2);font-size:14px}
.top .tr{display:flex;gap:8px;align-items:center;margin-top:2px}
.coin,.gear{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:999px;height:38px;padding:0 13px;display:flex;align-items:center;gap:6px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font:600 14.5px var(--fb)}
.gear{width:38px;padding:0;justify-content:center}
.gear svg{width:19px;height:19px}
.streak{padding:16px 16px 14px}
.sk-h{display:flex;align-items:center;gap:14px}
.sk-ic{font-size:38px;line-height:1;filter:drop-shadow(0 4px 12px rgba(232,133,58,.5))}
.sk-n{font:400 34px/1 var(--fd)}
.sk-n small{font:500 15px var(--fb);color:var(--ink2);margin-left:6px}
.sk-h p{font-size:13.5px;color:var(--ink2);margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3);font-weight:600}
.dot{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--ink3);opacity:.7}
.dot.on{border:0;opacity:1;background:radial-gradient(circle at 35% 30%,#fff1c4,#f3b556 45%,#e0782f);box-shadow:0 0 14px rgba(240,160,70,.6)}
.dot.ember{border:0;opacity:1;width:14px;height:14px;margin:5px;background:radial-gradient(circle,#f08a40,#a94a22);box-shadow:0 0 10px rgba(232,133,58,.55);animation:glow 3.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 5px rgba(232,133,58,.3);opacity:.7}}
.wd.today b{color:var(--ink)}
.intent{margin-top:12px;font-size:14px;color:var(--ink2)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-top:14px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.banner .bi{font-size:28px}
.banner b{display:block;font-weight:600;font-size:15px}
.banner span.s{font-size:13px;color:var(--ink2)}
.banner.refl{background:linear-gradient(120deg,color-mix(in srgb,#5a4a9a 32%,var(--glass)),color-mix(in srgb,#e98a5a 26%,var(--glass)))}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{appearance:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;border-radius:20px;color:var(--ink);transition:transform .15s,box-shadow .2s}
.cat:active{transform:scale(.97)}
.cat .rg{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center;font-size:21px}
.cat .rg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cat b{display:block;font-weight:600;font-size:14.5px;line-height:1.2}
.cat small{font-size:12px;color:var(--ink2)}
.cat.sel{box-shadow:0 0 0 2px var(--c),0 10px 30px var(--shadow);background:color-mix(in srgb,var(--c) 20%,var(--glass))}
.times{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.times::-webkit-scrollbar{display:none}
.times .chip{flex:none;padding:11px 17px}
.sugg{display:inline-flex;gap:6px;align-items:center;margin:0 0 12px;font-size:13.5px;color:var(--ink2);background:none;border:0;padding:0;cursor:pointer;text-align:left}
.sugg u{text-underline-offset:3px}
.mcard{padding:16px;margin-top:12px;position:relative;overflow:hidden;animation:rise .45s both}
.mcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.mcard:nth-child(2){animation-delay:.07s}.mcard:nth-child(3){animation-delay:.14s}
.mtag{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-weight:600}
.mtext{font:400 19px/1.35 var(--fd);margin:8px 0 14px}
.macts{display:flex;gap:8px;flex-wrap:wrap}
.macts .btn:first-child{flex:1 1 100%}
.macts .btn.ghost{flex:1}
.later{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-top:8px;border-radius:18px}
.later p{flex:1;font-size:14.5px}
.later small{display:block;color:var(--ink3);font-size:12px}
.x{appearance:none;border:0;background:none;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:6px}

/* ---------- Sheets ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end}
.scrim{position:absolute;inset:0;background:rgba(20,18,10,.36);opacity:0;transition:opacity .25s}
.sheet-wrap.in .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:560px;margin:0 auto;max-height:calc(100% - 34px);display:flex;flex-direction:column;
  background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(1.5);backdrop-filter:blur(30px) saturate(1.5);
  border:1px solid var(--stroke);border-bottom:0;border-radius:30px 30px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.in .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:9px;background:var(--ink3);opacity:.5;margin:9px auto 4px;flex:none}
.sbody{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.sbody h2{margin-bottom:4px}

.cel{text-align:center;padding-top:6px}
.bloom{width:110px;height:110px}
.bloom circle{fill:none;stroke:var(--accent);stroke-width:2;transform-origin:60px 60px}
.bloom .b1{animation:pulse 1.1s ease-out both}
.bloom .b2{animation:pulse 1.1s .15s ease-out both;opacity:.6}
@keyframes pulse{from{transform:scale(.4);opacity:1}to{transform:scale(1.15);opacity:0}}
.bloom .core{fill:var(--accent);stroke:none;animation:pop .5s .1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bloom .tick{fill:none;stroke:var(--on-accent);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .5s .45s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.earn{font:600 18px var(--fb);margin-top:2px;animation:rise .5s .7s both}
.lvl{margin:14px 6px 0;text-align:left;animation:rise .5s .8s both}
.lvl-h{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);font-weight:600;margin-bottom:6px}
.bar{height:9px;border-radius:9px;background:color-mix(in srgb,var(--ink) 12%,transparent);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent));transition:width 1.1s .9s cubic-bezier(.2,.8,.2,1)}
.lvup{margin-top:8px;font-weight:600;text-align:center}
.newstamp{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:6px;animation:flip 1s 1.2s both}
@keyframes flip{from{opacity:0;transform:perspective(500px) rotateY(90deg) scale(.8)}to{opacity:1;transform:none}}
.stamp{width:88px;padding:10px 6px 8px;text-align:center;background:#fffaf0;color:#4a4330;border-radius:3px;
  box-shadow:0 6px 16px rgba(60,50,20,.25);outline:2px dashed rgba(120,100,60,.4);outline-offset:-6px;transform:rotate(-2deg)}
.stamp .e{font-size:38px;line-height:1.2}
.stamp small{display:block;font-size:11px;line-height:1.2;margin-top:2px;font-weight:600}
.stamp.off{background:color-mix(in srgb,var(--ink) 8%,transparent);color:var(--ink3);box-shadow:none;outline-color:var(--ink3);transform:none}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:11px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px}
.mode span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.mode.on{background:var(--accent)}.mode.on span{color:var(--on-accent)}
.panel{margin-top:10px;display:grid;gap:8px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{appearance:none;cursor:pointer;background:var(--glass);border:1px solid var(--stroke);border-radius:18px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:26px;transition:transform .15s}
.rate span{font-size:11px;font-weight:600;color:var(--ink2);text-align:center;line-height:1.15}
.rate.on{background:color-mix(in srgb,var(--accent) 34%,var(--glass2));box-shadow:0 0 0 2px var(--accent);transform:scale(1.04)}
.preview{margin-top:12px}

/* Reflexión */
.refl{text-align:center}
.refl .face{font-size:84px;line-height:1.1;margin-top:8px;transition:transform .25s}
.refl .word{font:400 22px var(--fd);margin:2px 0 14px}
.sky{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:14px;outline:0;
  background:linear-gradient(90deg,#4b5b8f,#8a90b8,#f0c98a,#f4a35c,#f27fa0)}
.sky::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.sky::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 12px rgba(0,0,0,.3)}
.refl .q{margin:20px 0 10px;color:var(--ink2);font-weight:600}
.refl .chips{justify-content:center}
.refl .field{margin:14px 0}

/* ---------- Momentos ---------- */
.seg{display:flex;padding:4px;border-radius:999px;gap:2px;margin-bottom:14px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:999px;padding:9px 6px;font:600 14px var(--fb);color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--glass2);color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 8px var(--shadow)}
.navr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.navr b{font:400 18px var(--fd)}
.navr button{appearance:none;background:var(--glass);border:1px solid var(--stroke);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.navr button:disabled{opacity:.3}
.chapter{padding:22px 20px;position:relative;overflow:hidden;border-radius:26px}
.chapter h2{font-size:26px;line-height:1.15;color:#2d2e18;max-width:85%}
.chapter p{color:rgba(45,46,24,.7);font-size:14px;margin-top:6px}
.chapter .btn{position:absolute;right:14px;bottom:14px}
.chapter.dk h2{color:#fff8e6}.chapter.dk p{color:rgba(255,248,230,.75)}

const PULSE_Q=['Me sentí de buen ánimo.','Me sentí en calma y relajado.','Me sentí con energía.','Amanecí con sensación de descanso.','Mi día a día tuvo cosas que me interesaron.'];
const pk=(kind,key)=>(kind==='sem'?'w':'m')+key;
const pScore=a=>a.reduce((x,y)=>x+y,0)*4;
function pulseDue(){
  const now=new Date(),dow=now.getDay(),first=firstDay();if(!first)return null;
  const ws=weekStart(0),pw=addDays(ws,-7),ym=monthKey(now);
  const last=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()===now.getDate();
  if(dow===0&&!S.pulse['w'+ws])return {kind:'sem',key:ws};
  if(dow>=1&&dow<=3&&addDays(pw,6)>=first&&!S.pulse['w'+pw])return {kind:'sem',key:pw};
  if(last&&!S.pulse['m'+ym])return {kind:'mes',key:ym};
  const pm=new Date(now.getFullYear(),now.getMonth()-1,1),pym=monthKey(pm);
  if(now.getDate()<=3&&ymd(new Date(pm.getFullYear(),pm.getMonth()+1,0))>=first&&!S.pulse['m'+pym])return {kind:'mes',key:pym};
  return null;
}
function pulseList(kind){
  const p=kind==='sem'?'w':'m';

}
function pulseWord(score,kind){
  const n=kind==='sem'?'semana':'mes',f=kind==='sem'?'a':'';
  return score<36?'Un'+(kind==='sem'?'a':'')+' '+n+' pesad'+(kind==='sem'?'a':'o'):score<52?'Un'+(kind==='sem'?'a':'')+' '+n+' con altibajos':score<76?'Un'+(kind==='sem'?'a':'')+' '+n+' bastante bien':'Un'+(kind==='sem'?'a':'')+' '+n+' luminos'+(kind==='sem'?'a':'o');
}

function pulseResult(kind,key){
  const list=pulseList(kind),i=list.findIndex(x=>x.key===key),cur=list[i],prev=i>0?list[i-1]:null;

  if(prev){const d=cur.score-prev.score;cmp=d>=8?'Más luminoso que la anterior.':d<=-8?'Más pesado que la anterior.':'Parecido a la anterior.';}

function usageLink(kind){
  const list=pulseList(kind);if(list.length<4)return 'Con unas lecturas más podré compararlo con tu uso de la app.';
  const rows=list.map(r=>{
    let from,to;if(kind==='sem'){from=r.key;to=addDays(from,6);}else{const y=+r.key.split('-')[0],m=+r.key.split('-')[1];from=r.key+'-01';to=ymd(new Date(y,m,0));}
    let ci=0,n=0;for(let d=from;d<=to&&d<=today();d=addDays(d,1)){n++;if(S.checkins[d])ci++;}
    return {score:r.score,ratio:n?ci/n:0};
  }).sort((a,b)=>a.ratio-b.ratio);
  const h=Math.floor(rows.length/2),lo=rows.slice(0,h),hi=rows.slice(rows.length-h);
  const av=a=>a.reduce((x,y)=>x+y.score,0)/a.length,d=av(hi)-av(lo);

  return d>=8?'Tus '+p+' con más días encendidos tuvieron un termómetro más alto. No prueba que la app lo cause, pero es una buena pista.':d<=-8?'Tus '+p+' con más días encendidos no coinciden con un mejor termómetro. Quizá importe más qué vives que cuántos días enciendes.':'No veo una diferencia clara entre tus '+p+' de más y de menos uso.';

function expStats(from,to){
  let rs=0,rn=0,ms=0,mn=0,ci=0,mi=0,mins=0;
  for(let d=from;d<=to;d=addDays(d,1)){
    if(S.refl[d]){rs+=S.refl[d].r;rn++;}
    const c=S.checkins[d];if(c){ci++;if(c.mood!=null){ms+=5-c.mood;mn++;}}
  }
  S.log.forEach(e=>{if(e.d>=from&&e.d<=to){mi++;mins+=e.t;}});
  return {mood:rn?rs/rn:(mn?ms/mn:null),src:rn?'reflexiones':'check-ins',ci:ci,mi:mi,mins:mins};
}

async function recStart(){
  if(!voiceOK()){toast('Tu navegador no permite grabar audio.');return;}
  const sid=U.sh&&U.sh.id;if(!sid)return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    let mime='';for(const t of ['audio/webm;codecs=opus','audio/webm','audio/mp4','']){if(!t||MediaRecorder.isTypeSupported(t)){mime=t;break;}}
    const mr=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream),chunks=[];
    mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data);};
    mr.onstop=()=>{
      stream.getTracks().forEach(x=>x.stop());
      const iv=U.rec&&U.rec.iv;if(iv)clearInterval(iv);
      const dur=U.rec?Math.round((Date.now()-U.rec.t0)/1000):0;U.rec=null;
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}),fr=new FileReader();
      fr.onload=()=>{const e=S.log.find(x=>x.id===sid);if(!e)return;const key='vo_'+sid;idbPut(key,String(fr.result));e.moment=e.moment||{};e.moment.voice=key;e.moment.vdur=dur;save();if(U.sh&&U.sh.id===sid)refreshRest();};
      fr.readAsDataURL(blob);
    };
    mr.start();
    U.rec={mr:mr,t0:Date.now(),iv:setInterval(()=>{const s=Math.round((Date.now()-U.rec.t0)/1000),b=$('#recbtn');if(b)b.textContent='Detener ('+pad(Math.floor(s/60))+':'+pad(s%60)+')';if(s>=30)recStop();},500)};
    refreshRest();
  }catch(e){toast('No pude usar el micrófono.');}
}

function holdStop(){

/* Efectos de ambiente */
const fx={mode:'',parts:[],raf:0,w:0,h:0};
const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxResize(){const cv=$('#fx');const d=Math.min(window.devicePixelRatio||1,2);fx.w=window.innerWidth;fx.h=window.innerHeight;cv.width=fx.w*d;cv.height=fx.h*d;cv.getContext('2d').setTransform(d,0,0,d,0,0);}
const FXE={leaves:['🍂','🍁'],petals:['🌸','💮','🌼']};
function mkPart(mode,init){
  const p={x:Math.random()*fx.w,y:init?Math.random()*fx.h:-30,ph:Math.random()*6};
  if(FXE[mode]){p.s=14+Math.random()*12;p.vy=.35+Math.random()*.7;p.r=Math.random()*6;p.vr=(Math.random()-.5)*.03;p.e=FXE[mode][rnd(FXE[mode].length)];}
  else if(mode==='rain'){p.l=10+Math.random()*16;p.vy=9+Math.random()*7;p.x=Math.random()*(fx.w+40);}
  else if(mode==='snow'){p.r=1.4+Math.random()*3;p.vy=.4+Math.random();}
  else if(mode==='bubbles'){p.y=init?Math.random()*fx.h:fx.h+30;p.r=4+Math.random()*16;p.vy=-(.3+Math.random()*.7);}
  else if(mode==='stars'||mode==='aurora'){p.y=Math.random()*fx.h*(mode==='aurora'?.75:1);p.r=.5+Math.random()*1.5;p.tw=1+Math.random()*3;}
  else if(mode==='fireflies'){p.y=Math.random()*fx.h;p.r=2+Math.random()*2.5;p.vx=(Math.random()-.5)*.4;p.vy=(Math.random()-.5)*.4;}
  else if(mode==='dust'){p.y=Math.random()*fx.h;p.r=.8+Math.random()*1.8;p.vx=.3+Math.random()*.9;p.vy=(Math.random()-.5)*.15;}
  else{p.r=6+Math.random()*24;p.y=init?Math.random()*fx.h:fx.h+30;p.vy=-(.12+Math.random()*.3);p.a=.08+Math.random()*.16;p.col=mode==='bokeh'?['#ff77b7','#6fe0ff','#ffc35a','#a98bff'][rnd(4)]:['#ffd08a','#ff9f7a','#ffe7b0'][rnd(3)];}
  return p;
}
function fxLoop(){
  const c=$('#fx').getContext('2d');c.clearRect(0,0,fx.w,fx.h);
  const t=performance.now()/1000,m=fx.mode;
  if(m==='aurora'){
    const cols=['#5cf2b0','#4fb8ff','#a678ff'];
    for(let k=0;k<3;k++){
      c.save();c.globalAlpha=.12;c.lineWidth=90+k*20;c.lineCap='round';
      const g=c.createLinearGradient(0,0,fx.w,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,cols[k]);g.addColorStop(1,'rgba(0,0,0,0)');c.strokeStyle=g;
      c.beginPath();
      for(let x=-20;x<=fx.w+20;x+=24){const y=fx.h*.22+k*70+Math.sin(x*.006+t*.25+k*1.7)*55+Math.sin(x*.013+t*.4)*20;if(x===-20)c.moveTo(x,y);else c.lineTo(x,y);}
      c.stroke();c.restore();
    }
  }
  fx.parts.forEach((p,i)=>{
    if(FXE[m]){
      p.y+=p.vy;p.x+=Math.sin(t+p.ph)*.6;p.r+=p.vr;if(p.y>fx.h+30)fx.parts[i]=mkPart(m);
      c.save();c.translate(p.x,p.y);c.rotate(p.r+Math.sin(t*.8+p.ph)*.4);c.globalAlpha=.75;c.font=p.s+'px serif';c.textAlign='center';c.fillText(p.e,0,0);c.restore();
    }else if(m==='rain'){
      p.y+=p.vy;p.x-=1.4;if(p.y>fx.h+20)fx.parts[i]=mkPart('rain');
      c.strokeStyle='rgba(190,220,255,.32)';c.lineWidth=1.1;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-1.6,p.y+p.l);c.stroke();
    }else if(m==='snow'){
      p.y+=p.vy;p.x+=Math.sin(t*.7+p.ph)*.5;if(p.y>fx.h+10)fx.parts[i]=mkPart('snow');
      c.save();c.shadowColor='rgba(70,110,160,.55)';c.shadowBlur=5;c.fillStyle='rgba(255,255,255,.96)';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.restore();
    }else if(m==='bubbles'){
      p.y+=p.vy;p.x+=Math.sin(t+p.ph)*.4;if(p.y<-30)fx.parts[i]=mkPart('bubbles');
      c.strokeStyle='rgba(220,250,255,.5)';c.fillStyle='rgba(220,250,255,.08)';c.lineWidth=1.2;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.stroke();
    }else if(m==='stars'||m==='aurora'){
      const a=.3+.7*Math.abs(Math.sin(t*p.tw*.5+p.ph));c.fillStyle='rgba(255,255,255,'+(a*.9).toFixed(2)+')';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();
    }else if(m==='fireflies'){
      p.x+=p.vx+Math.sin(t*.6+p.ph)*.3;p.y+=p.vy+Math.cos(t*.5+p.ph)*.3;
      if(p.x<-10)p.x=fx.w+10;if(p.x>fx.w+10)p.x=-10;if(p.y<-10)p.y=fx.h+10;if(p.y>fx.h+10)p.y=-10;
      const a=.3+.7*Math.abs(Math.sin(t*1.3+p.ph)),g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
      g.addColorStop(0,'rgba(230,255,120,'+(a*.9).toFixed(2)+')');g.addColorStop(1,'rgba(230,255,120,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r*6,0,7);c.fill();
    }else if(m==='dust'){
      p.x+=p.vx;p.y+=p.vy;if(p.x>fx.w+5){p.x=-5;p.y=Math.random()*fx.h;}
      c.fillStyle='rgba(170,105,55,.35)';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();
    }else{
      p.y+=p.vy;p.x+=Math.sin(t*.4+p.ph)*.25;if(p.y<-40)fx.parts[i]=mkPart(fx.mode);
      const a=p.a*(.7+.3*Math.sin(t+p.ph)),g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
      g.addColorStop(0,p.col);g.addColorStop(1,'transparent');c.globalAlpha=a*2.4;c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1;
    }
  });
  if(m==='stars'){
    if(!fx.shoot&&Math.random()<.0025)fx.shoot={x:Math.random()*fx.w*.8+fx.w*.1,y:Math.random()*fx.h*.4,l:0};
    if(fx.shoot){
      const s=fx.shoot;s.l++;
      const x0=s.x+(s.l-14)*7,y0=s.y+(s.l-14)*3.2,x1=s.x+s.l*7,y1=s.y+s.l*3.2,g=c.createLinearGradient(x0,y0,x1,y1);
      g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.9)');c.strokeStyle=g;c.lineWidth=1.6;c.beginPath();c.moveTo(x0,y0);c.lineTo(x1,y1);c.stroke();
      if(s.l>60)fx.shoot=null;
    }
  }
  fx.raf=requestAnimationFrame(fxLoop);
}
function setFx(mode){
  if(fx.mode===mode)return;fx.mode=mode;fx.shoot=null;cancelAnimationFrame(fx.raf);fxResize();
  const c=$('#fx').getContext('2d');c.clearRect(0,0,fx.w,fx.h);
  if(!mode||reduced){fx.parts=[];return;}
  const n={rain:70,leaves:20,petals:18,snow:70,bubbles:26,stars:80,aurora:50,fireflies:26,dust:60}[mode]||22;
  fx.parts=[];for(let i=0;i<n;i++)fx.parts.push(mkPart(mode,true));
  fxLoop();
}

function bindCI(){
  const orb=$('#orb');if(!orb)return;
  if(orb.classList.contains('lit')){$('#ci-after').innerHTML=ciAfter();return;}
  const prog=$('#prog'),em=$('#embers');let raf=0,start=0,holding=false,lastTick=0;
  const setP=p=>{if(em)em.style.setProperty('--p',String(p));};
  const step=()=>{
    if(!holding)return;
    const now=performance.now(),p=Math.min(1,(now-start)/1200);
    prog.style.strokeDashoffset=String(100-p*100);setP(p);
    if(now-lastTick>260){lastTick=now;buzz(5);}
    if(p>=1){holding=false;holdStop();ignite();return;}
    raf=requestAnimationFrame(step);
  };
  orb.addEventListener('pointerdown',e=>{
    if(orb.classList.contains('lit'))return;
    e.preventDefault();holding=true;start=performance.now();lastTick=start;
    prog.style.transition='none';orb.classList.add('hold');holdStart();
    try{orb.setPointerCapture(e.pointerId);}catch(_){}
    raf=requestAnimationFrame(step);
  });
  const stop=()=>{
    if(!holding)return;holding=false;cancelAnimationFrame(raf);holdStop();
    orb.classList.remove('hold');prog.style.transition='stroke-dashoffset .5s ease';prog.style.strokeDashoffset='100';setP(0);
  };
  orb.addEventListener('pointerup',stop);orb.addEventListener('pointercancel',stop);
  orb.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ignite();}});
  orb.addEventListener('contextmenu',e=>e.preventDefault());
}
function ignite(){

  if(gap>=2){orb.classList.add('flare');const fl=document.createElement('div');fl.className='flash';$('.ci').appendChild(fl);setTimeout(()=>fl.remove(),1800);}
  const pr=$('#prog');pr.style.transition='stroke-dashoffset .3s';pr.style.strokeDashoffset='0';
  const sp=$('#sparks'),ns=22+Math.min(gap,12)*3;
  for(let i=0;i<ns;i++){const a=Math.random()*Math.PI*2,d=90+Math.random()*90;const s=document.createElement('i');s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');sp.appendChild(s);}

/* ============ Resumen ============ */
function rangeOf(kind,off){
  if(kind==='anio'){const y=new Date().getFullYear()-off;return {from:y+'-01-01',to:y+'-12-31'};}
  if(kind==='sem'){const f=addDays(weekStart(0),-7*off);return {from:f,to:addDays(f,6)};}
  const d=monthOf(off);return {from:ymd(d),to:ymd(new Date(d.getFullYear(),d.getMonth()+1,0))};
}
function summarize(from,to){
  const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
  const t=today(),first=firstDay();
  const ci=days.filter(d=>S.checkins[d]).length;
  const br=days.filter(d=>first&&d>first&&d<t&&!S.checkins[d]).length;
  const ent=S.log.filter(e=>e.d>=from&&e.d<=to);
  const mins=ent.reduce((a,e)=>a+e.t,0);
  const by={};CATS.forEach(c=>by[c.id]={min:0,sc:0,n:0});
  ent.forEach(e=>{by[e.cat].min+=e.t;by[e.cat].n++;if(e.rate)by[e.cat].sc+=RV[e.rate];});
  const ranked=CATS.filter(c=>by[c.id].n).sort((a,b)=>(by[b.id].sc*10+by[b.id].min)-(by[a.id].sc*10+by[a.id].min));
  const loved={};ent.filter(e=>e.rate==='love').forEach(e=>{loved[e.m]=(loved[e.m]||0)+1;});
  const refl=days.filter(d=>S.refl[d]);
  const avg=refl.length?Math.round(refl.reduce((a,d)=>a+S.refl[d].r,0)/refl.length):0;
  return {days:days,ci:ci,br:br,ent:ent,mins:mins,by:by,ranked:ranked,loved:Object.keys(loved),refl:refl,avg:avg,moms:ent.filter(hasMoment)};
}
function minText(m){if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+r+' min':'');}
function viewRes(){
  const kind=U.sView,off=U.sOff,r=rangeOf(kind,off),sm=summarize(r.from,r.to),t=today();
  if(kind==='anio')return viewYear(off,r,sm);
  const a=parseD(r.from),b=parseD(r.to);
  const inProg=r.to>=t;
  const title=kind==='sem'?'Tu semana':chapterFor(r.from.slice(0,7)).name;
  const sub=kind==='sem'?a.getDate()+' '+MON[a.getMonth()].slice(0,3)+' a '+b.getDate()+' '+MON[b.getMonth()].slice(0,3):cap(MON[a.getMonth()])+' '+a.getFullYear();
  let line='';
  if(!sm.ci&&!sm.ent.length)line=kind==='sem'?'Una semana en silencio. Tu fuego sigue aquí, tibio, esperándote.':'Un mes en pausa. Volver también es avanzar.';
  else{
    const p=[];
    if(sm.ci>=Math.ceil(sm.days.length*.7))p.push('Volviste a ti casi todos los días.');
    else if(sm.ci)p.push('Volviste a ti '+(sm.ci===1?'un día':sm.ci+' días')+', y cada uno cuenta.');
    if(sm.ranked.length)p.push(CAT[sm.ranked[0].id].n+' fue lo que más te nutrió.');
    if(sm.br)p.push('Las brasas también son parte del fuego.');
    line=p.join(' ');
  }
  let o='<h1 style="margin-bottom:14px">Resumen</h1><div class="seg glass">'+[['sem','Semana'],['mes','Mes'],['anio','Año']].map(x=>'<button class="'+(kind===x[0]?'on':'')+'" data-a="resView" data-v="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  o+='<div class="navr"><button data-a="resNav" data-v="1" aria-label="Anterior">‹</button><b>'+sub+'</b><button data-a="resNav" data-v="-1" '+(off===0?'disabled':'')+' aria-label="Siguiente">›</button></div>';
  o+='<section class="glass sumhead"><h2>'+esc(title)+'</h2>'+(inProg?'<p class="tiny" style="margin-top:4px">'+(kind==='sem'?'Avance. Se completa el domingo.':'Avance. Se cierra el último día del mes.')+'</p>':'')+'<p class="line">'+line+'</p></section>';
  o+='<button class="btn wide" style="margin-top:12px" data-a="storyOpen" data-kind="'+kind+'" data-off="'+off+'">'+(inProg?'Ver avance':'Ver la ceremonia')+'</button>';
  if(kind==='sem'){
    o+='<section class="glass card"><h3 style="margin-top:0">Días encendidos</h3><div class="sday">'+sm.days.map(d=>{const dt=parseD(d),c=S.checkins[d];let dot='<i class="dot"></i>';if(c)dot='<i class="dot on"></i>';else if(firstDay()&&d>firstDay()&&d<t)dot='<i class="dot ember"></i>';const rf=S.refl[d];return '<div class="wd"><b>'+DOWS[dt.getDay()].charAt(0).toUpperCase()+'</b>'+dot+'<span class="m">'+(rf?FACE[rf.r-1]:'')+'</span></div>';}).join('')+'</div></section>';
  }else{
    o+='<section class="glass card"><h3 style="margin-top:0">Tu mes en luz</h3><div class="sday" style="grid-template-columns:repeat(auto-fill,minmax(20px,1fr));gap:6px;justify-items:center">'+sm.days.map(d=>{const c=S.checkins[d];let dot='<i class="dot"></i>';if(c)dot='<i class="dot on" style="width:16px;height:16px"></i>';else if(firstDay()&&d>firstDay()&&d<t)dot='<i class="dot ember" style="width:10px;height:10px;margin:3px"></i>';else dot='<i class="dot" style="width:16px;height:16px"></i>';return dot;}).join('')+'</div></section>';
  }
  if(sm.ent.length){
    const mx=Math.max.apply(null,sm.ranked.map(c=>sm.by[c.id].min));
    o+='<section class="glass card"><h3 style="margin-top:0">Lo que más viviste</h3>'+sm.ranked.slice(0,4).map(c=>'<div class="brow" style="--c:'+c.c+'"><span>'+c.e+' '+c.n+'</span><div class="bar"><i style="width:'+Math.max(8,sm.by[c.id].min/mx*100)+'%"></i></div></div>').join('')+'<p class="tiny" style="margin-top:10px">Dedicaste '+minText(sm.mins)+' a estar presente.</p></section>';
  }
  if(sm.refl.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Cómo se sintieron tus días</h3><p style="font:400 24px var(--fd)">'+FACE[sm.avg-1]+' '+FWORD[sm.avg-1]+'</p><p class="tiny" style="margin-top:4px">Cerraste '+(sm.refl.length===1?'un día':sm.refl.length+' días')+' con una reflexión.</p></section>';
  }
  if(sm.moms.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Momentos guardados</h3><div class="mosaic">'+sm.moms.slice(0,6).map((e,i)=>tileFor(e,i)).join('')+'</div></section>';
  }
  if(sm.loved.length){
    o+='<section class="glass card"><h3 style="margin-top:0">Para repetir</h3><p class="quote">“'+esc(sm.loved[0])+'”</p><p class="tiny" style="margin-top:8px">Te encantó. Puedes repetirla o buscar algo parecido.</p></section>';
  }
  if(!sm.ent.length&&!sm.ci)o+='<p class="empty" style="margin-top:14px">Cuando vivas algo, aquí aparecerá con calma.</p>';
  o+=moodCard()+energyCard()+pulseRes(kind)+caminoCard();
  return o;
}

/* ============ Tienda ============ */
function isEq(it){
  const E=S.equip;
  if(it.k==='theme')return E.theme===it.id;
  if(it.k==='bg')return E.bg===it.id&&!E.theme;
  if(it.k==='pal')return E.pal===it.id&&!E.theme;
  if(it.k==='icon')return E.icon===it.id;
  if(it.k==='frame')return E.frame===it.id;
  if(it.k==='coll')return E.coll===it.id;
  return false;
}
function preview(it){
  const g=c=>'background:linear-gradient(135deg,'+c[0]+','+c[1]+','+c[2]+','+c[3]+')';
  if(it.k==='theme'||it.k==='bg'||it.k==='pal'){
    if(!it.c)return '<div class="pv glass" style="font-size:22px">'+(it.k==='pal'?'🌗':'✦')+'</div>';
    return '<div class="pv" style="'+g(it.c)+'">'+(THEME_EMO[it.id]||'')+'</div>';
  }
  if(it.k==='icon')return '<div class="pv glass">'+it.e+'</div>';
  if(it.k==='frame')return '<div class="pv glass"><div class="ph'+(it.id!=='none'?' fr-'+it.id:'')+'"><div class="fake"></div></div></div>';
  if(it.k==='chap')return '<div class="pv" style="background:linear-gradient(135deg,'+it.cover[0]+','+it.cover[1]+');font:400 11px/1.2 var(--fd);padding:6px;text-align:center;color:'+(it.dk?'#fff8e6':'#2d2e18')+'">'+esc(it.n)+'</div>';
  if(it.k==='coll')return '<div class="pv"><div class="pvq"><i style="background:'+it.g[0]+'"></i><i style="background:'+it.g[1]+'"></i><i style="background:'+it.g[2]+'"></i><i style="background:'+it.g[3]+'"></i></div></div>';
  return '<div class="pv glass">'+it.e+'</div>';
}

    }).join('')+'</div></section>';

function buy(k,id){
  const it=IT(k,id);if(!it)return;
  if(k==='theme'&&!owns(k,id)&&!themeAvail(id)){toast('Ese tema llega con su temporada.');return;}
  if(S.coins<it.p){toast('Ese tema cuesta '+it.p+' monedas; llegarán con tus misiones.');return;}
  if(k==='pack'){
    const free=allFree();if(!free.length){toast('Ya tienes todas las estampillas ✨');return;}
    const key=free[rnd(free.length)];S.coins-=it.p;giveStamp(key,'sobre',{});save();sfx('stamp');buzz(12);
    U.stick=null;U.sh={kind:'pack',stamps:[key],placed:{}};
    openSheet(packHTML());
    return;
  }
  S.coins-=it.p;S.owned.push(k+':'+id);sfx('buy');buzz(12);
  if(k!=='chap'&&k!=='page'){equipItem(k,id,true);}
  save();toast(it.n+' ya es tuyo');render();
}
function equipItem(k,id,silent){
  const E=S.equip;
  if(k==='theme')E.theme=E.theme===id&&!silent?'':id;
  else if(k==='bg'){E.bg=id;E.theme='';}
  else if(k==='pal'){E.pal=id;E.theme='';}
  else if(k==='icon')E.icon=id;
  else if(k==='frame')E.frame=id;
  else if(k==='coll')E.coll=E.coll===id&&!silent?'':id;
}

/* ============ Respaldo ============ */
function canShareFiles(){
  try{return coarse&&!!navigator.canShare&&navigator.canShare({files:[new File(['x'],'a.txt',{type:'text/plain'})]});}catch(e){return false;}
}
async function saveBlob(name,blob,noShare){
  try{
    if(!noShare&&canShareFiles()){await navigator.share({files:[new File([blob],name,{type:blob.type})],title:name});return 'shared';}
  }catch(e){if(e&&e.name==='AbortError')return 'cancel';}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},5000);
  return 'download';
}
function backupText(){return JSON.stringify({app:'presente',v:1,exported:new Date().toISOString(),s:S,p:PH});}
function lastBackupText(){return S.backup.last?'Último respaldo: '+dateLong(parseD(S.backup.last)).toLowerCase()+'.':'Sin copia de seguridad todavía.';}
function previewImport(text){
  const box=$('#backup');if(!box)return;
  try{
    const o=JSON.parse(text);if(!o||!o.s||o.s.v!==1)throw new Error('x');
    U.imp=o;const s=o.s;
    const days=Object.keys(s.checkins||{}).length,ms=(s.log||[]).length,ph=Object.keys(o.p||{}).length;
    box.innerHTML='<div class="glass card" style="margin-top:10px"><b>Respaldo encontrado</b><p class="soft" style="margin-top:4px">'+(o.exported?'Del '+dateLong(new Date(o.exported)).toLowerCase()+'. ':'')+days+' días encendidos, '+ms+' misiones, '+ph+' fotos.</p><p class="tiny" style="margin-top:6px">Restaurar reemplaza lo que hay ahora en este dispositivo.</p><button class="btn sm" style="margin-top:10px" data-a="importDo">Restaurar</button></div>';
  }catch(e){U.imp=null;box.innerHTML='<p class="tiny" style="margin-top:10px">Ese archivo no parece un respaldo de Presente.</p>';}
}

const TOPLINE={
 presencia:['Aprendiste a quedarte donde estabas.','Estuviste más aquí, en lo que pasaba.'],
 conexion:['Los tuyos estuvieron más cerca.','Le diste tiempo a quienes quieres.'],
 cuidado:['Te cuidaste con gestos pequeños.','Te trataste con más ternura.'],
 curiosidad:['Te preguntaste cosas, y eso abre puertas.','Miraste con ganas de saber.'],
 creatividad:['Hiciste cosas solo por hacerlas.','Dejaste que algo nuevo saliera de ti.'],
 exploracion:['Miraste tu mundo como si fuera nuevo.','Te asomaste a lugares que no habías visto.'],
 calma:['Bajaste el ritmo y nada se cayó.','Le diste espacio a la calma.'],
 valentia:['Hiciste cosas que daban un poco de miedo.','Te acercaste a lo que venías evitando.'],
 disfrute:['Te permitiste disfrutar sin culpa.','Elegiste lo que de verdad se te antojaba.'],
 energia:['Le diste movimiento a tu cuerpo.','Cuidaste tu energía con hechos simples.']
};
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function elapsed(sm){return sm.days.filter(d=>d<=today()).length||1;}
function sumLine(kind,sm){
  if(!sm.ci&&!sm.ent.length)return kind==='sem'?'Una semana en silencio. Tu fuego sigue aquí, tibio, esperándote.':'Un mes en pausa. Volver también es avanzar.';
  const p=[];
  if(sm.ci>=Math.ceil(elapsed(sm)*.7))p.push('Volviste a ti casi todos los días.');
  else if(sm.ci)p.push('Volviste a ti '+(sm.ci===1?'un día':sm.ci+' días')+', y cada uno cuenta.');
  if(sm.ranked.length)p.push(CAT[sm.ranked[0].id].n+' fue lo que más te nutrió.');
  return p.join(' ');
}
function closingPhrase(kind,sm,seed){
  const pk=(a,s)=>a[Math.abs(hashStr(seed+s))%a.length];
  if(!sm.ci&&!sm.ent.length)return pk(['Fue un tiempo de pausa. Tu fuego te espera igual.','No pasó mucho por fuera, y está bien. Tu brasa sigue aquí.'],'z');
  const ratio=sm.ci/elapsed(sm);
  let a;
  if(ratio>=.8)a=pk(['Casi cada día volviste a ti.','Encendiste tu fuego casi todos los días.'],'a');
  else if(ratio>=.5)a=pk(['Volviste a ti más veces de las que dejaste enfriar.','Tu fuego se mantuvo vivo casi todo el tiempo.'],'a');
  else if(sm.ci)a=pk(['Hubo brasas, y aun así el fuego siguió.','Volviste a ti cuando pudiste, y eso cuenta.'],'a');
  else a='Las brasas siguieron tibias.';
  let b=sm.ranked.length?' '+pk(TOPLINE[sm.ranked[0].id],'b'):'';
  let c=sm.avg>=4?' Tus días se sintieron luminosos.':(sm.avg&&sm.avg<=2?' Hubo días pesados y los llevaste con paciencia.':'');
  let d='';
  if(sm.loved.length)d=' Lo que más se quedó contigo: “'+trunc(sm.loved[0],60)+'”.';
  else if(sm.moms.length)d=' Guardaste '+(sm.moms.length===1?'un momento':sm.moms.length+' momentos')+' para recordarlo.';
  return a+b+c+d;
}
function bestMoments(sm){
  const sc=e=>(e.star?4:0)+(e.moment&&e.moment.photo&&PH[e.moment.photo]?2:0)+(e.rate==='love'?1.5:e.rate==='ok'?.5:0);
  return sm.moms.slice().sort((x,y)=>sc(y)-sc(x)||y.ts-x.ts).slice(0,4);
}
function tileStatic(e,i){

  if(m.photo&&PH[m.photo])return '<div class="tile st" style="'+dl+'"><img src="'+PH[m.photo]+'" alt=""></div>';

  return '<div class="tile st" style="'+dl+'background:'+b.bg+';'+(b.dk?'color:#fff8e6':'')+'">'+txt+'</div>';

function maybeCeremony(){

function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
function glow(c,x,y,r,hex,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexA(hex,a));g.addColorStop(1,hexA(hex,0));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function wrapLines(c,text,maxW){
  const words=String(text).split(/\s+/),lines=[];let cur='';
  words.forEach(w=>{const t=cur?cur+' '+w:w;if(c.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;});
  if(cur)lines.push(cur);return lines;
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

 edFilter(el){edSync();U.edCat=el.dataset.id;U.cfDel=null;edRefresh(true);},
 edEdit(el){const m=MID[el.dataset.id];if(!m)return;U.ed={id:m.id,base:!m.custom,cat:m.cat,t:m.t,text:m.text,mini:m.mini||''};U.f.edtext=m.text;U.f.edmini=U.ed.mini;U.edCat=m.cat;U.cfDel=null;edRefresh(false);},
 edCancel(){U.ed=edDefaults();U.f.edtext='';edRefresh(true);},
 edSave(){
  edSync();const text=(U.ed.text||'').trim();if(!text){toast('Escribe la misión primero');return;}
  const e=U.ed;
  if(e.id&&e.base){const b=BASE.find(x=>x.id===e.id);if(text===b.text)delete S.edits[e.id];else S.edits[e.id]=text;const nm=(e.mini||'').trim(),bm=MINI_BY[e.id]||'';if(nm===bm)delete S.miniEdits[e.id];else S.miniEdits[e.id]=nm;}
  else if(e.id){const c=S.custom.find(x=>x.id===e.id);if(c){c.text=text;c.cat=e.cat;c.t=e.t;c.mini=(e.mini||'').trim();}}
  else S.custom.push({id:'c.'+uid(),cat:e.cat,t:e.t,text:text,mini:(e.mini||'').trim()});
  save();refreshMissionState();
  U.edCat=e.cat;U.ed=Object.assign(edDefaults(),{cat:e.cat,t:e.t});U.f.edtext='';U.f.edmini='';
  edRefresh(false);toast('Misión guardada');render();
 },
 edDel(el){
  const id=el.dataset.id;edSync();
  if(U.cfDel!==id){U.cfDel=id;edRefresh(true);return;}
  U.cfDel=null;const m=MID[id];if(!m)return;
  if(m.custom)S.custom=S.custom.filter(x=>x.id!==id);else if(S.hidden.indexOf(id)<0)S.hidden.push(id);
  if(U.ed.id===id){U.ed=edDefaults();U.f.edtext='';}
  save();refreshMissionState();edRefresh(true);toast('Misión quitada');render();
 },
 edRevert(el){edSync();delete S.edits[el.dataset.id];delete S.miniEdits[el.dataset.id];if(U.ed.id===el.dataset.id){U.ed=edDefaults();U.f.edtext='';}save();refreshMissionState();edRefresh(true);render();},
 edRestore(el){edSync();S.hidden=S.hidden.filter(x=>x!==el.dataset.id);save();refreshMissionState();edRefresh(true);render();},
 bkSnooze(){S.backup.snooze=addDays(today(),3);save();render();},
 async exportFile(){
  try{
   const r=await saveBlob('presente-respaldo-'+today()+'.json',new Blob([backupText()],{type:'application/json'}));
   if(r==='cancel')return;
   S.backup.last=today();save();
   const b=$('#bklast');if(b)b.textContent=lastBackupText();
   toast(r==='shared'?'Respaldo listo para guardar':'Respaldo generado. Si no ves el archivo, usa Copiar texto');
  }catch(e){toast('No pude crear el respaldo');}
 },
 exportText(){
  const txt=backupText();
  $('#backup').innerHTML='<textarea class="field" id="bk" rows="4" readonly style="margin-top:10px"></textarea>';
  const ta=$('#bk');ta.value=txt;ta.focus();ta.select();
  let ok=false;try{ok=document.execCommand&&document.execCommand('copy');}catch(_){}
  if(!ok&&navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Respaldo copiado'),()=>{});
  S.backup.last=today();save();const b=$('#bklast');if(b)b.textContent=lastBackupText();
  toast(ok?'Respaldo copiado':'Selecciona y copia el texto');
 },
 importPaste(){$('#backup').innerHTML='<textarea class="field" id="bk" rows="4" placeholder="Pega aquí tu respaldo" style="margin-top:10px"></textarea><button class="btn sm" style="margin-top:8px" data-a="importReview">Revisar respaldo</button>';},
 importReview(){const t=$('#bk');previewImport(t?t.value:'');},
 importDo(el){
  if(!U.imp)return;
  if(el.dataset.cf!=='1'){el.dataset.cf='1';el.textContent='Toca otra vez para reemplazar';return;}
  const o=U.imp;Object.keys(PH).forEach(idbDel);
  S=normalize(o.s);Object.keys(o.p||{}).forEach(k=>idbPut(k,o.p[k]));
  rebuildMissions();save();U.imp=null;U.deck=null;U.sug=null;U.cat=null;U.t=null;
  toast('Datos restaurados');closeSheet();
 },
 testFx(){buzz([20,50,20]);sfx('done');},
 storyOpen(el){openStory(el.dataset.kind,+(el.dataset.off||0));},
 storyNext(){const s=U.story;if(!s)return;if(s.i<s.cards.length-1){storyShow(s.i+1);sfx('card');buzz(5);}},
 storyPrev(){const s=U.story;if(!s)return;if(s.i>0){storyShow(s.i-1);sfx('card');}},
 storyClose(){$$('.story').forEach(x=>x.remove());U.story=null;setTimeout(maybeCeremony,450);},
 async storyImg(){
  if(!U.story)return;toast('Preparando tu imagen…');
  try{
   const blob=await (U.story.kind==='anio'?renderYearImage():renderShare()),url=URL.createObjectURL(blob);
   U.img={blob:blob,url:url,name:'presente-'+(U.story.kind==='sem'?'semana':U.story.kind==='anio'?'anio':'mes')+'-'+U.story.r.from+'.png'};
   openSheet('<h2 style="text-align:center">Tu imagen</h2><img class="shareimg" src="'+url+'" alt="Resumen listo para compartir"><p class="tiny" style="text-align:center">Si no se descarga, mantén presionada la imagen para guardarla.</p><div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">'+(canShareFiles()?'<button class="btn" data-a="imgShare">Compartir</button>':'')+'<button class="btn ghost" data-a="imgSave">Descargar</button></div>');
   U.sh={kind:'img'};
  }catch(e){toast('No pude crear la imagen');}
 },
 async imgShare(){
  if(!U.img)return;
  try{await navigator.share({files:[new File([U.img.blob],U.img.name,{type:'image/png'})],title:'Presente'});}catch(e){}
 },
 async imgSave(){
  if(!U.img)return;
  await saveBlob(U.img.name,U.img.blob,true);toast('Imagen generada. Si no se descargó, mantén presionada la imagen');
 },

 saveName(){S.name=(U.f.name||'').trim();save();toast('Listo');closeSheet();},
 resetAll(el){
  if(!U.confirmReset){U.confirmReset=true;el.textContent='Toca otra vez para borrar todo';return;}
  Object.keys(PH).forEach(idbDel);Object.keys(SNAPS).forEach(k=>{idbDelRaw(k);delete SNAPS[k];});try{localStorage.removeItem(KEY+':prev');}catch(e){}S=normalize(defaults());rebuildMissions();U.sug=null;save();U.cat=null;U.t=null;U.deck=null;U.skipCI=false;U.ciOpen=false;U.tab='hoy';closeSheet();
 }
};
const QUIET=new Set(['done','sugDone','laterDo','buy','saveRefl','storyNext','storyPrev','closeSheet','testFx','exportFile','stickDo','albNext','albPrev','energy','hvTick','rTick','ctxSet']);
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;if(!QUIET.has(a)){buzz(6);sfx('tap');}
  const f=A[a];if(f){f(el,e);}
});
document.addEventListener('pointermove',e=>{const w=e.target.closest&&e.target.closest('.stampw');if(!w||w.classList.contains('off'))return;const r=w.getBoundingClientRect();w.style.setProperty('--sx',(((e.clientX-r.left)/r.width)*140-20).toFixed(0)+'%');},{passive:true});
document.addEventListener('pointerout',e=>{const w=e.target.closest&&e.target.closest('.stampw');if(w&&!w.contains(e.relatedTarget))w.style.setProperty('--sx','-40%');});
document.addEventListener('keydown',e=>{
  if(U.acer){if(e.key==='ArrowRight'||e.key===' ')A.albNext();else if(e.key==='ArrowLeft')A.albPrev();else if(e.key==='Escape')A.albClose();return;}
  if(!U.story)return;
  if(e.key==='ArrowRight'||e.key===' ')A.storyNext();
  else if(e.key==='ArrowLeft')A.storyPrev();
  else if(e.key==='Escape')A.storyClose();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='stickrot'&&U.stick){U.stick.rot=+t.value;const w=$('.stick .slotb.sel .stampw');if(w)w.style.transform='rotate('+t.value+'deg)';}
  if(t.dataset&&t.dataset.bind)U.f[t.dataset.bind]=t.value;
  if(t.dataset&&t.dataset.bind==='mq'){U.q=t.value;U.msn=30;const rr=$('#msres');if(rr)rr.innerHTML=searchResults();}
  if(t.dataset&&t.dataset.bind==='eq'){U.eq=t.value;const ll=$('#edlist');if(ll)ll.innerHTML=edListHTML();}
  if(t.id==='rrange'&&U.sh&&U.sh.kind==='refl'){
    const v=+t.value;U.sh.r=v;$('#rface').textContent=FACE[v-1];$('#rword').textContent=FWORD[v-1];
    const sh=$('.sheet');if(sh)sh.style.boxShadow='0 -20px 60px '+FTINT[v-1]+'66,inset 0 1px 0 rgba(255,255,255,.4)';
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='reflnow'){S.dev.reflNow=t.checked;save();}
  if(t.id==='hapt'){S.prefs.haptics=t.checked;save();if(t.checked)buzz(15);}
  if(t.id==='snd'){S.prefs.sound=t.checked;save();if(t.checked)sfx('done');}
  if(t.id==='calm'){S.prefs.calm=t.checked;if(t.checked&&U.tab==='tie')U.tab='hoy';save();render();}
   if(t.id==='noauto'){S.prefs.noAutoCer=!t.checked;save();}
  if(t.id==='walkfile'&&t.files&&t.files[0]&&U.walk){readPhoto(t.files[0]).then(url=>{U.walk.photo=url;shRefresh(walkHTML());}).catch(()=>toast('No pude leer esa foto'));}
  if(t.id==='bday'){S.birthday=t.value?t.value.slice(5):'';save();toast('Listo');}
  if(t.id==='bfile'&&t.files&&t.files[0]){const fr=new FileReader();fr.onload=()=>previewImport(String(fr.result));fr.onerror=()=>toast('No pude leer ese archivo');fr.readAsText(t.files[0]);t.value='';}
  if(t.id==='file'&&t.files&&t.files[0]&&U.sh&&U.sh.kind==='complete'){
    const file=t.files[0],s=U.sh;
    readPhoto(file).then(url=>{const e=S.log.find(x=>x.id===s.id);const key='ph_'+e.id;idbPut(key,url);e.moment=e.moment||{};e.moment.photo=key;save();if(U.sh===s)refreshRest();}).catch(()=>toast('No pude leer esa foto'));
  }
});
document.addEventListener('pointerdown',()=>{if(S.prefs.scapeMode){scapeSync();const c=ac();if(c&&c.state==='suspended')c.resume();}},{passive:true});
document.addEventListener('pointermove',e=>{const d=U.drag;if(!d)return;const dx=e.clientX-d.x0,dy=e.clientY-d.y0;if(!d.moved&&Math.hypot(dx,dy)<8)return;d.moved=true;d.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';d.el.style.zIndex=5;d.el.style.transition='none';},{passive:true});
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('[data-arr]');if(!b||!U.arr)return;U.drag={k:b.dataset.arr,el:b,x0:e.clientX,y0:e.clientY,moved:false};});
document.addEventListener('pointerup',e=>{
  const d=U.drag;if(!d)return;U.drag=null;d.el.style.transform='';d.el.style.zIndex='';
  if(!d.moved){U.arrSel=U.arrSel===d.k?null:d.k;refreshAlb();return;}
  d.el.style.pointerEvents='none';const t=document.elementFromPoint(e.clientX,e.clientY);d.el.style.pointerEvents='';
  const sl=t&&t.closest&&t.closest('.slot[data-slot]');if(sl)moveStamp(d.k,+sl.dataset.slot);refreshAlb();
});
document.addEventListener('visibilitychange',()=>{const c=ac();if(!c)return;if(document.visibilityState==='hidden'){try{c.suspend();}catch(e){}}else if(S.prefs.scapeMode){try{c.resume();}catch(e){}}});
window.addEventListener('hashchange',handleHash);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')applyDayTint();});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&U.day!==today()){U.day=today();U.skipCI=false;U.ciOpen=false;U.mOff=0;U.wOff=0;U.sOff=0;U.sug=null;U.sugN=0;render();}
});

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-(S.meta.lastCheck||0)>6*3600*1000)checkUpdate(false);});

/* ============ Arranque ============ */
if(!document.querySelector('link[rel=apple-touch-icon]'))makeIcon();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
Promise.race([idbOpen().then(idbAll),new Promise(r=>setTimeout(r,2500))]).then(()=>{
  if(UPD){
    const k='snap:'+String(Date.now())+'@'+(UPD.from||'anterior');SNAPS[k]=UPD.raw;idbPutRaw(k,UPD.raw);
    const ks=Object.keys(SNAPS).sort();while(ks.length>2){const old=ks.shift();delete SNAPS[old];idbDelRaw(old);}
    UPD=null;
  }
  save();render();handleHash();
  setTimeout(()=>checkUpdate(false),4000);setTimeout(checkStorage,2500);setInterval(applyDayTint,900000);
});
})();
</script>
</body>
</html>
